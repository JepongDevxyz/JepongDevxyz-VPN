name: V13 Source NPE Diagnostic

on:
  push:
    branches:
      - aide-v13-fresh-build-verify
    paths:
      - '.github/v13-source-diagnose-url.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aide-v13-fresh-build-verify
      - name: Download exact V13 and inspect NavigationView usage
        shell: bash
        run: |
          set -euo pipefail
          URL="$(tr -d '\r\n' < .github/v13-source-diagnose-url.txt)"
          case "$URL" in https://*) ;; *) echo 'URL must be HTTPS' >&2; exit 1;; esac
          rm -rf /tmp/v13diag /tmp/v13diag.zip
          curl -fL --retry 2 "$URL" -o /tmp/v13diag.zip
          mkdir -p /tmp/v13diag
          unzip -q /tmp/v13diag.zip -d /tmp/v13diag
          MAIN="$(find /tmp/v13diag -type f -path '*/src/com/jepongdevxyz/vpn/MainActivity.java' -print -quit)"
          NAVSRC="$(find /tmp/v13diag -type f -path '*/src/com/google/android/material/navigation/NavigationView.java' -print -quit)"
          NAVXML="$(find /tmp/v13diag -type f -path '*/res/layout/nav_header.xml' -print -quit)"
          test -n "$MAIN"; test -n "$NAVSRC"; test -n "$NAVXML"
          echo '=== MainActivity.java 810-855 ==='
          nl -ba "$MAIN" | sed -n '810,855p'
          echo '=== NavigationView shim ==='
          nl -ba "$NAVSRC" | sed -n '1,260p'
          echo '=== nav_header.xml ==='
          nl -ba "$NAVXML" | sed -n '1,140p'
          echo '=== all NavigationView / drawerNavigationView usages ==='
          grep -R -n --include='*.java' -E 'drawerNavigationView|NavigationView|\.getMenu\(\)|getHeaderView\(|inflateHeaderView\(' /tmp/v13diag | head -n 300 || true
          echo '=== navigation menu XML ==='
          MENU="$(find /tmp/v13diag -type f -path '*/res/menu/navigation_menu.xml' -print -quit)"
          if [[ -n "$MENU" ]]; then nl -ba "$MENU" | sed -n '1,260p'; fi
