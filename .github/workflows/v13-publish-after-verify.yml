name: Publish V13 Source After Verification

on:
  push:
    branches:
      - aide-v13-fresh-build-verify
    paths:
      - '.github/v13-baseline-url.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4

      - name: Require a baseline URL trigger
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/v13-baseline-url.txt
          grep -q '^https://' .github/v13-baseline-url.txt

      - name: Wait for matching end-to-end verifier and require success
        id: wait
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for i in $(seq 1 180); do
            JSON="$(gh api "repos/$REPO/actions/workflows/v13-end-to-end-verify.yml/runs?branch=aide-v13-fresh-build-verify&event=push&per_page=20")"
            RUN_ID="$(python3 -c 'import json,sys,os; d=json.load(sys.stdin); sha=os.environ["GITHUB_SHA"]; xs=[r for r in d.get("workflow_runs",[]) if r.get("head_sha")==sha]; print(xs[0]["id"] if xs else "")' <<<"$JSON")"
            if [[ -n "$RUN_ID" ]]; then
              STATUS="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status)"
              CONCLUSION="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
              echo "Verifier run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
              if [[ "$STATUS" == 'completed' ]]; then
                [[ "$CONCLUSION" == 'success' ]] || { echo "Verifier did not succeed: $CONCLUSION" >&2; exit 1; }
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for matching verifier run.' >&2
          exit 1

      - name: Require verified build artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID='${{ steps.wait.outputs.run_id }}'
          JSON="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100")"
          ART_ID="$(python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[a for a in d.get("artifacts",[]) if a.get("name")=="JepongDevxyz-VPN-V13-verified-build" and not a.get("expired")]; print(xs[0]["id"] if xs else "")' <<<"$JSON")"
          test -n "$ART_ID" || { echo 'Verified artifact missing; refusing to publish.' >&2; exit 1; }
          echo "artifact_id=$ART_ID" >> "$GITHUB_OUTPUT"

      - name: Download and validate verified source artifact
        shell: bash
        run: |
          set -euo pipefail
          ART_ID='${{ steps.artifact.outputs.artifact_id }}'
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ART_ID/zip" \
            -o "$RUNNER_TEMP/verified-artifact.zip"
          rm -rf "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/verified-source"
          mkdir -p "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/verified-source"
          unzip -q "$RUNNER_TEMP/verified-artifact.zip" -d "$RUNNER_TEMP/artifact"
          SOURCE_ZIP="$(find "$RUNNER_TEMP/artifact" -type f -name 'JepongDevxyz-VPN-AIDE-V13-Verified-Source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/verified-source"
          test -f "$RUNNER_TEMP/verified-source/AndroidManifest.xml"
          test -f "$RUNNER_TEMP/verified-source/FRESH-BUILD-VERIFICATION.txt"
          grep -q 'ADB_INSTALL=PASS' "$RUNNER_TEMP/verified-source/FRESH-BUILD-VERIFICATION.txt"
          grep -q 'LAUNCH_NO_IMMEDIATE_FATAL=PASS' "$RUNNER_TEMP/verified-source/FRESH-BUILD-VERIFICATION.txt"
          grep -q 'targetSdk: 30' "$RUNNER_TEMP/verified-source/FRESH-BUILD-VERIFICATION.txt"

      - name: Push verified source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JepongDevxyz Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            "$RUNNER_TEMP/verified-source/" ./
          git add -A
          if git diff --cached --quiet; then
            echo 'Verified source already matches main.'
            exit 0
          fi
          git commit -m 'fix: publish verified AIDE V13 source'
          git push origin HEAD:main
          echo 'Verified source pushed to main after build/install evidence passed.'
