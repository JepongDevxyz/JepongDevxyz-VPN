name: AIDE V13 Fresh Clean Build

on:
  workflow_dispatch:
  push:
    branches:
      - aide-v13-fresh-build-verify

jobs:
  clean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 30 toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-30' 'build-tools;30.0.3'

      - name: Verify classic AIDE project layout
        shell: bash
        run: |
          set -euo pipefail
          test -f AndroidManifest.xml
          test -f project.properties
          test -d src
          test -d gen
          test -d res
          test -d libs
          grep -qx 'target=android-30' project.properties

      - name: Fresh resource validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .verify-build
          mkdir -p .verify-build/generated .verify-build/classes
          AAPT="$ANDROID_HOME/build-tools/30.0.3/aapt"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-30/android.jar"
          "$AAPT" package -f -m \
            -M AndroidManifest.xml \
            -S res \
            -A assets \
            -I "$ANDROID_JAR" \
            -J .verify-build/generated

      - name: Fresh Java compilation
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-30/android.jar"
          CP="$ANDROID_JAR"
          while IFS= read -r -d '' jar; do CP="$CP:$jar"; done < <(find libs -maxdepth 1 -type f -name '*.jar' -print0)
          find src gen .verify-build/generated -type f -name '*.java' -print0 > .verify-build/java-sources.bin
          xargs -0 javac \
            -source 8 -target 8 \
            -encoding UTF-8 \
            -Xlint:none \
            -classpath "$CP" \
            -d .verify-build/classes \
            < .verify-build/java-sources.bin

      - name: Report fresh build evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'FRESH RESOURCE COMPILE: PASS'
          echo 'FRESH JAVA COMPILE: PASS'
          echo "Compiled class files: $(find .verify-build/classes -type f -name '*.class' | wc -l)"
          echo 'AIDE V13 SOURCE COMPILE ERRORS: 0'
