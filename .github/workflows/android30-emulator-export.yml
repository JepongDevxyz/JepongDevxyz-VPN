name: Export Android 30 Emulator Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - aide-v13-fresh-build-verify
    paths:
      - '.github/workflows/android30-emulator-export.yml'

# Install-verification runtime export; source tree is not modified by this job.
jobs:
  export-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 30 emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64'
      - name: Stage compress and split emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android30-emulator-runtime runtime-parts android30-emulator-runtime.tar.zst
          mkdir -p android30-emulator-runtime runtime-parts
          cp -a "$ANDROID_HOME/emulator" android30-emulator-runtime/
          cp -a "$ANDROID_HOME/platform-tools" android30-emulator-runtime/
          mkdir -p android30-emulator-runtime/system-images/android-30/google_apis
          cp -a "$ANDROID_HOME/system-images/android-30/google_apis/x86_64" android30-emulator-runtime/system-images/android-30/google_apis/
          du -sh android30-emulator-runtime
          "$ANDROID_HOME/platform-tools/adb" version
          tar -S --use-compress-program='zstd -3 -T0' -cf android30-emulator-runtime.tar.zst android30-emulator-runtime
          sha256sum android30-emulator-runtime.tar.zst | tee runtime-parts/full-sha256.txt
          split -b 400M -d -a 2 android30-emulator-runtime.tar.zst runtime-parts/runtime.part-
          ls -lh runtime-parts
          sha256sum runtime-parts/runtime.part-* | tee runtime-parts/parts-sha256.txt
      - name: Upload runtime part 00
        uses: actions/upload-artifact@v4
        with:
          name: android30-emulator-runtime-part-00
          path: runtime-parts/runtime.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload runtime part 01
        uses: actions/upload-artifact@v4
        with:
          name: android30-emulator-runtime-part-01
          path: runtime-parts/runtime.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload runtime part 02
        uses: actions/upload-artifact@v4
        with:
          name: android30-emulator-runtime-part-02
          path: runtime-parts/runtime.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload runtime part 03
        uses: actions/upload-artifact@v4
        with:
          name: android30-emulator-runtime-part-03
          path: runtime-parts/runtime.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload runtime part 04
        uses: actions/upload-artifact@v4
        with:
          name: android30-emulator-runtime-part-04
          path: runtime-parts/runtime.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload runtime checksums
        uses: actions/upload-artifact@v4
        with:
          name: android30-emulator-runtime-checksums
          path: |
            runtime-parts/full-sha256.txt
            runtime-parts/parts-sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
